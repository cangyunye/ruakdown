name: Release

# 推送 v* tag 时构建 Windows / macOS 安装包并自动发布 GitHub Release
# 产物:
#   windows → Ruakdown_*_x64-setup.exe (NSIS, amd64)
#   macOS   → Ruakdown_*_aarch64.dmg 与 Ruakdown.app (Apple Silicon)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # 单平台失败不取消另一平台
      fail-fast: false
      matrix:
        include:
          # macOS 只出 Apple Silicon (arm64)
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Windows 只出 amd64 (x86_64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      # 限制 cargo 并行度,防止链接器内存不足(与 Taskfile 的 build 一致)
      CARGO_BUILD_JOBS: '4'
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建安装包并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # __VERSION__ 取自 src-tauri/tauri.conf.json 的 version
          tagName: ruakdown-v__VERSION__
          releaseName: 'Ruakdown v__VERSION__'
          releaseBody: '从下方 Assets 下载对应平台的安装包。'
          # 构建成功即自动正式发布
          releaseDraft: false
          prerelease: false
